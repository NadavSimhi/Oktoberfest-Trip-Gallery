<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Shared trip gallery with albums, WhatsApp media, searchable captions and manual people tags."
    />
    <title>Oktoberfest Trip Gallery</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Oktoberfest Trip</p>
        <h1>Gallery</h1>
      </div>
      <button class="search-button" id="searchFab" type="button" aria-label="Open search">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path
            d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
          />
        </svg>
      </button>
    </header>

    <main>
      <section class="filter-strip" aria-label="Gallery filters">
        <select id="albumFilter" aria-label="Album filter"></select>
        <select id="senderFilter" aria-label="Sender filter"></select>
        <select id="personFilter" aria-label="Person filter"></select>
        <button class="text-button" id="clearFilters" type="button">Clear</button>
      </section>

      <section class="album-strip" id="albumGrid" aria-label="Albums"></section>

      <section class="gallery-head">
        <p id="resultSummary">Loading media</p>
      </section>
      <section class="media-grid" id="mediaGrid" aria-live="polite"></section>
    </main>

    <aside class="search-panel" id="searchPanel" aria-hidden="true">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
        <div class="sheet-head">
          <h2 id="searchTitle">Search gallery</h2>
          <button id="closeSearch" class="icon-button" type="button" aria-label="Close search">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="m18 6-12 12M6 6l12 12"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="2"
              />
            </svg>
          </button>
        </div>
        <input
          id="searchInput"
          type="search"
          autocomplete="off"
          placeholder="Search sender, person, album, tag or caption"
        />
        <div class="quick-tags" id="quickTags"></div>
      </div>
    </aside>

    <aside class="detail-panel" id="detailPanel" aria-hidden="true">
      <div class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <div class="detail-toolbar">
          <button id="closeDetail" class="icon-button" type="button" aria-label="Close details">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="m18 6-12 12M6 6l12 12"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="2"
              />
            </svg>
          </button>
        </div>
        <div class="detail-media" id="detailMedia"></div>
        <div class="detail-content">
          <p class="media-meta" id="detailMeta"></p>
          <h2 id="detailTitle"></h2>
          <p id="detailDescription"></p>
          <dl class="detail-list" id="detailList"></dl>
          <div class="tag-row" id="detailTags"></div>
        </div>
      </div>
    </aside>

    <template id="albumTemplate">
      <button class="album-pill" type="button"></button>
    </template>

    <template id="mediaTemplate">
      <article class="media-card">
        <button class="thumb-button" type="button">
          <span class="thumb"></span>
        </button>
      </article>
    </template>

    <script src="./app.js" type="module"></script>
  </body>
</html>
